# Local development only: app + a throw-away Postgres (production uses Neon).
services:
  db:
    image: postgres:16-alpine
    environment: { POSTGRES_USER: manweta, POSTGRES_PASSWORD: manweta, POSTGRES_DB: manweta }
    ports: ["5432:5432"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U manweta"], interval: 5s, retries: 10 }
  app:
    build: .
    depends_on: { db: { condition: service_healthy } }
    ports: ["8000:8000"]
    env_file: [.env]
    environment:
      DATABASE_URL: postgresql://manweta:manweta@db:5432/manweta
