<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="mGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d2ff"/>
      <stop offset="46%" stop-color="#05dfd7"/>
      <stop offset="54%" stop-color="#f7b731"/>
      <stop offset="100%" stop-color="#f39c12"/>
    </linearGradient>
    <filter id="mGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <!-- Background Glow & Outer Track -->
  <path d="M22 76 V30 A13 13 0 0 1 43 21 L50 34 L57 21 A13 13 0 0 1 78 30 V76" 
        stroke="url(#mGrad)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.3" filter="url(#mGlow)"/>
  <!-- Main High-Tech Letter M Track -->
  <path d="M22 76 V30 A13 13 0 0 1 43 21 L50 34 L57 21 A13 13 0 0 1 78 30 V76" 
        stroke="url(#mGrad)" stroke-width="9.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  
  <!-- Left Side: Cyan Circuitry & Nodes -->
  <path d="M22 66 V32 A7 7 0 0 1 34 26 L47 43" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <circle cx="22" cy="70" r="4" fill="#00f2fe"/>
  <circle cx="22" cy="70" r="1.8" fill="#ffffff"/>
  
  <!-- Center Intersection: Data Mesh -->
  <line x1="43" y1="36" x2="57" y2="36" stroke="#00f2fe" stroke-width="1.8" stroke-dasharray="2 2"/>
  <line x1="45" y1="42" x2="55" y2="42" stroke="#f7b731" stroke-width="1.8" stroke-dasharray="2 2"/>
  <line x1="48" y1="48" x2="52" y2="48" stroke="#f7b731" stroke-width="1.8"/>

  <!-- Right Side: Amber Gold Circuitry & Micro-nodes -->
  <path d="M78 66 V32 A7 7 0 0 0 66 26 L53 43" stroke="#ffb300" stroke-width="2.5" stroke-linecap="round" fill="none"/>
  <circle cx="78" cy="70" r="4" fill="#ffb300"/>
  <circle cx="78" cy="70" r="1.8" fill="#ffffff"/>
  <circle cx="70" cy="50" r="2.2" fill="#ffb300"/>
  <circle cx="75" cy="56" r="1.6" fill="#ffb300"/>
  <circle cx="68" cy="58" r="1.6" fill="#ffb300"/>
</svg>
